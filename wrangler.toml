name = "neetflix-bot-v2"
main = "dist/index.js"
compatibility_date = "2024-11-01"

# Webhook Telegram -> jalankan sekali setelah deploy:
#   https://<nama-worker>.workers.dev/setwebhook?key=<SETUP_KEY>
# (wajib pakai key yang sama dengan rahasia SETUP_KEY / SECRET_TOKEN)
# (?host=... bila pakai custom domain)

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "Neetflix_KV"
id = "b5505b88b1ab4a06918e72505c9328b9"

# Vault akun sekarang ada di D1, bukan lagi satu blob di KV.
[[d1_databases]]
binding = "VAULT_DB"
database_name = "neetflix-vault"
database_id = "bae092ac-a8c8-4b8b-802c-f5e674f3adcf"

# Variabel NON-rahasia ditaruh di sini supaya deploy berikutnya tidak
# kehilangan konfigurasi. Rahasia (BOT_TOKEN, SECRET_TOKEN, SETUP_KEY,
# ADMIN_WEB_KEY) disimpan lewat `wrangler secret put`, TIDAK di file ini.
[vars]
ADMIN_ID = "6968439759"
ADMIN_USERNAME = "iMediafairy"
CHANNEL_ID = "-1002952378946"
CHANNEL_URL = "https://t.me/MediafairyCh"
# 0 = unlimited (tanpa batas harian). Cooldown tetap berlaku.
FREE_DAILY_LIMIT = "0"
COOLDOWN_MS = "60000"
# Maksimal 25: free plan membatasi 50 subrequest per eksekusi Worker.
BATCH_SIZE = "25"
CONVERT_BATCH = "25"
BROADCAST_BATCH = "25"
# Stiker loading saat generate (hanya generate, bukan convert/menu).
# Nama set diambil dari t.me/addstickers/<nama>. 0 = mati.
LOADING_MS = "10000"
LOADING_STICKERS = "mfload"
# Grup "RecordBot" (@MFrecordbot) — tujuan catatan tiap generate user biasa.
# Bot @MFnftokenBot sudah admin di sana. Kosongkan untuk mematikan.
GROUP_ID = "-1003744140971"
DONATION_QRIS_URL = ""
WEBHOOK_PATH = "/webhook"
