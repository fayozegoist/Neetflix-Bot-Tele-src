name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Obfuscate
        run: npm run obfuscate

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Rahasia hanya didorong bila secret-nya tersedia di repo.
      - name: Push Worker secrets
        if: ${{ secrets.BOT_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.BOT_TOKEN }}"     | npx wrangler secret put BOT_TOKEN
          echo "${{ secrets.SECRET_TOKEN }}"  | npx wrangler secret put SECRET_TOKEN
          echo "${{ secrets.SETUP_KEY }}"     | npx wrangler secret put SETUP_KEY

      # Kunci /admin hanya didorong bila ada di repo — kalau tidak, secret yang
      # sudah terpasang TIDAK boleh tertimpa nilai kosong.
      - name: Push ADMIN_WEB_KEY
        if: ${{ secrets.ADMIN_WEB_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.ADMIN_WEB_KEY }}" | npx wrangler secret put ADMIN_WEB_KEY
